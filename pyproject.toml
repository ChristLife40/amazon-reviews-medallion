[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'reviews-pipeline'
version = '0.1.0'
description = 'Medallion (bronze/silver/gold) PySpark pipeline for Amazon product reviews'
requires-python = '>=3.10,<3.13'
dependencies = [
  'pyspark>=3.5,<3.6',
  'fastapi>=0.115,<1.0',
  'uvicorn>=0.30,<1.0',
  'pydantic>=2.7,<3.0',
  'azure-identity>=1.17,<2.0',
  'azure-storage-file-datalake>=12.16,<13.0',
]

[project.optional-dependencies]
dev = ['pytest>=8.0', 'ruff>=0.6', 'httpx>=0.27']

[project.scripts]
reviews-pipeline = 'reviews_pipeline.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ['tests']
